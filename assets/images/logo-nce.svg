<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Modern Container -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="9" y="9" width="102" height="102" rx="25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Speed Wings Accent -->
  <path d="M78 18 L96 34 L88 34 L72 20 Z" fill="url(#goldGrad)"/>
  <path d="M86 14 L102 28 L96 28 L82 16 Z" fill="#fef08a" opacity="0.9"/>

  <!-- NCE Letters (Clean Bold Geometry) -->
  <g fill="#ffffff">
    <!-- N -->
    <path d="M22 72 V36 H29 L41 58 V36 H47 V72 H41 L28 49 V72 Z"/>
    
    <!-- C -->
    <path d="M70 42 C67 36 57 36 54 44 C51 52 53 62 64 63 C67 63 69 62 71 60 L73 65 C70 68 65 69 60 69 C48 69 44 57 47 47 C50 37 59 31 70 31 C73 31 77 32 79 35 Z"/>

    <!-- E -->
    <path d="M76 72 V36 H97 V42 H83 V51 H94 V57 H83 V66 H98 V72 Z"/>
  </g>

  <!-- Express Speed Dash Underline -->
  <path d="M22 79 L88 79 L98 83 L28 83 Z" fill="url(#goldGrad)"/>
</svg>
